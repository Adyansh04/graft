[project]
name = "graft"
version = "0.1.0"
description = "GRAFT — object-centric synthetic data generation: USD asset to domain-randomized clips to a trained detector."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "numpy>=2.2",
    # USD inspection outside the Isaac runtime. Never install this into the
    # Isaac venv: it ships its own compiled pxr that collides with Isaac's.
    "usd-core>=25.8",
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
]

[project.scripts]
graft = "graft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graft"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
